<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anthos — Matematik Macerası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F1E3; --cream-2:#F0E8D4; --ink:#241BC3; --ink-deep:#171050; --charcoal:#1B1A2A;
    --bloom:#E85C4A; --bloom-soft:#F4B9AE; --sage:#7C9D6F; --sage-soft:#DCE6D3;
    --gold:#C99A2E; --gold-soft:#F3E3BE; --line:rgba(23,16,80,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    font-family:'Plus Jakarta Sans', sans-serif; color:var(--charcoal);
    overflow:hidden; position:fixed; inset:0;
  }
  h1,h2,h3{font-family:'Fraunces', serif; color:var(--ink-deep); font-weight:600;}

  #gameRoot{position:fixed; inset:0; overflow:hidden;}

  /* ---------- Scenes ---------- */
  .scene{
    position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.35s ease; overflow:hidden;
  }
  .scene.active{opacity:1; pointer-events:auto;}

  .scene-bg-welcome{background:linear-gradient(180deg,#FCF3DC 0%, #F7F1E3 55%, #EFE3C4 100%);}
  .scene-bg-library{background:linear-gradient(180deg,#F1DCC2 0%, #E7C7A3 55%, #D8B287 100%);}
  .scene-bg-vault{background:linear-gradient(180deg,#241BC3 0%, #171050 55%, #14102f 100%);}
  .scene-bg-plaza{background:linear-gradient(180deg,#F7F1E3 0%, #E4EBDB 55%, #C9D9BE 100%);}
  .scene-bg-result{background:linear-gradient(180deg,#F8E9C4 0%, #F7F1E3 50%, #F6C7BA 100%);}

  .scene-deco{position:absolute; inset:0; pointer-events:none; z-index:0;}
  .deco-cloud{position:absolute; border-radius:50%; background:rgba(255,255,255,0.55); filter:blur(1px);}
  .deco-shelf{position:absolute; left:0; right:0; height:10px; background:rgba(91,70,54,0.35);}
  .deco-star{position:absolute; width:5px; height:5px; background:var(--gold-soft); border-radius:50%; box-shadow:0 0 6px 1px rgba(243,227,190,0.7);}
  .deco-ground{position:absolute; bottom:-60px; left:50%; transform:translateX(-50%); width:140%; height:160px; border-radius:50%; background:var(--sage-soft); opacity:0.6;}
  .deco-dot{position:absolute; width:8px; height:8px; border-radius:50%;}

  /* ---------- Top chrome: home + arrows ---------- */
  .home-btn, .nav-arrow{
    position:fixed; z-index:30; width:46px; height:46px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px); box-shadow:0 8px 20px rgba(23,16,80,0.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.15s ease;
  }
  .home-btn:hover, .nav-arrow:hover:not(:disabled){transform:scale(1.08);}
  .nav-arrow:disabled{opacity:0.25; cursor:default;}
  .home-btn{top:18px; left:18px;}
  .nav-arrow.left{top:50%; left:14px; transform:translateY(-50%);}
  .nav-arrow.right{top:50%; right:14px; transform:translateY(-50%);}
  .nav-arrow svg, .home-btn svg{width:20px; height:20px;}

  /* ---------- Scene inner layout ---------- */
  .scene-inner{
    position:relative; z-index:2; width:100%; max-width:1080px; display:flex; align-items:flex-end;
    justify-content:center; gap:18px; padding:70px 70px 26px; flex-wrap:wrap;
  }
  .mascot-wrap{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; position:relative;}
  .mascot-wrap.pair{flex-direction:row; align-items:flex-end; gap:6px;}
  .mascot{width:120px; height:auto; filter:drop-shadow(0 14px 14px rgba(23,16,80,0.18));}
  .mascot.small{width:92px;}

  .panel{
    flex:1 1 420px; max-width:560px; background:rgba(255,255,255,0.95); backdrop-filter:blur(6px);
    border-radius:26px; padding:28px 26px; box-shadow:0 30px 60px rgba(23,16,80,0.28);
    max-height:76vh; overflow-y:auto;
  }

  .bubble{
    position:relative; background:#fff; border-radius:18px; padding:14px 18px; font-size:15px;
    line-height:1.5; color:var(--ink-deep); font-weight:600; box-shadow:0 14px 30px rgba(23,16,80,0.16);
    margin-bottom:10px; max-width:340px;
  }
  .bubble:after{
    content:""; position:absolute; left:26px; bottom:-8px; width:16px; height:16px; background:#fff;
    clip-path:polygon(0 0, 100% 0, 0 100%);
  }

  .badge{
    display:inline-block; background:var(--gold-soft); color:#7a5c14; font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    padding:5px 13px; border-radius:100px; margin-bottom:10px;
  }
  .panel h1{font-size:clamp(20px,3vw,26px); margin-bottom:6px;}
  .panel p.sub{font-size:14px; opacity:0.75; margin-bottom:16px; line-height:1.5;}

  .hidden{display:none !important;}

  /* ---------- Grade picker ---------- */
  .kademe-group{margin-bottom:16px;}
  .kademe-group:last-child{margin-bottom:0;}
  .kademe-title{font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;}
  .grade-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .grade-btn{
    border:1.5px solid var(--line); background:var(--cream); color:var(--ink-deep);
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:13.5px;
    padding:10px 14px; border-radius:12px; cursor:pointer; transition:all 0.15s ease;
  }
  .grade-btn:hover{border-color:var(--ink); background:#fff; transform:translateY(-2px);}

  .start-btn, .cta-btn, .next-btn, .check-btn{
    display:block; width:100%; text-align:center; padding:14px 20px; border:none; border-radius:100px;
    background:var(--ink); color:#fff; text-decoration:none; font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; transition:transform 0.15s ease; box-shadow:0 10px 22px rgba(36,27,195,0.3);
    margin-top:6px;
  }
  .start-btn:hover, .next-btn:hover, .check-btn:hover{transform:translateY(-2px);}
  .cta-btn{background:var(--bloom); box-shadow:0 10px 24px rgba(232,92,74,0.35); margin-bottom:8px;}

  .level-pill{display:inline-block; background:var(--ink-deep); color:#fff; font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:700; padding:5px 14px; border-radius:100px; margin-bottom:8px;}

  /* ---------- Challenge ---------- */
  .stars-row{display:flex; justify-content:center; gap:8px; margin-bottom:14px;}
  .star{width:22px; height:22px; opacity:0.25; transition:all 0.25s ease;}
  .star.filled{opacity:1; transform:scale(1.15);}
  .challenge-tag{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink); margin-bottom:10px;}
  .challenge-title{font-size:17px; font-weight:700; color:var(--ink-deep); margin-bottom:18px; text-align:center; line-height:1.4;}

  .digit-boxes{display:flex; gap:7px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;}
  .digit-box{width:42px; height:52px; border:2px solid var(--line); border-radius:11px; background:var(--cream); text-align:center; font-size:22px; font-weight:800; color:var(--ink-deep); font-family:'JetBrains Mono', monospace;}
  .digit-box:focus{outline:none; border-color:var(--ink); background:#fff;}
  .digit-box.correct{border-color:var(--sage); background:var(--sage-soft); color:#2f4a26;}
  .digit-box.wrong{border-color:var(--bloom); background:var(--bloom-soft); color:#7a2a1f; animation:shake 0.4s;}

  .lock-scene{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; flex-wrap:wrap;}
  .lock-steps{display:flex; flex-direction:column; gap:12px;}
  .lock-step{font-size:12.5px; color:var(--charcoal); opacity:0.7; font-weight:700;}
  .lock-expr{font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:700; color:var(--bloom);}
  .lock-visual{width:80px; height:80px;}
  .lock-inputs{display:flex; gap:9px; justify-content:center; margin-bottom:14px;}
  .lock-input{width:54px; height:48px; border:2px solid var(--line); border-radius:11px; background:var(--cream); text-align:center; font-size:18px; font-weight:800; color:var(--ink-deep); font-family:'JetBrains Mono', monospace;}
  .lock-input:focus{outline:none; border-color:var(--ink); background:#fff;}
  .lock-input.correct{border-color:var(--sage); background:var(--sage-soft); color:#2f4a26;}
  .lock-input.wrong{border-color:var(--bloom); background:var(--bloom-soft); color:#7a2a1f; animation:shake 0.4s;}

  .bulmaca-options{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:8px;}
  .opt-pill{min-width:60px; padding:12px 18px; border-radius:100px; border:2px solid var(--line); background:var(--cream); color:var(--ink-deep); font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size:14px; cursor:pointer; transition:all 0.15s ease;}
  .opt-pill:hover:not(:disabled){border-color:var(--ink); transform:translateY(-2px);}
  .opt-pill:disabled{cursor:default;}
  .opt-pill.correct{background:var(--sage-soft); border-color:var(--sage); color:#2f4a26;}
  .opt-pill.wrong{background:var(--bloom-soft); border-color:var(--bloom); color:#7a2a1f; animation:shake 0.4s;}

  .feedback-msg{text-align:center; font-size:13.5px; font-weight:700; margin:10px 0; min-height:18px;}
  .feedback-msg.ok{color:#3d6b2e;}
  .feedback-msg.no{color:#a13f2f;}
  .feedback-msg.hint{color:var(--gold);}
  .hidden-btn{display:none !important;}

  @keyframes shake{10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(5px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);}}
  @keyframes pop{0%{transform:scale(0.85); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .pop-in{animation:pop 0.3s ease;}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}}
  .mascot{animation:bob 3.2s ease-in-out infinite;}

  .result-score{text-align:center; margin-bottom:16px;}
  .result-score .big{font-family:'Fraunces', serif; font-size:34px; color:var(--ink-deep); font-weight:700;}
  .result-score .label{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--charcoal); opacity:0.65; text-transform:uppercase; letter-spacing:0.04em;}

  .reveal-box{background:var(--gold-soft); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
  .reveal-box .tag{font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700; color:#7a5c14; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; display:block;}
  .reveal-box p{font-size:13px; line-height:1.5; color:#4a3a10;}

  .parent-box{background:var(--ink-deep); border-radius:16px; padding:16px; margin-bottom:16px;}
  .parent-box .tag{font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700; color:var(--bloom-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:7px; display:block;}
  .parent-box p{font-size:13px; line-height:1.55; color:#fff; font-style:italic;}

  .retry-link{display:block; text-align:center; margin-top:10px; font-size:12.5px; color:var(--ink-deep); opacity:0.65; text-decoration:none; font-family:'JetBrains Mono', monospace; cursor:pointer;}
  .retry-link:hover{opacity:1; text-decoration:underline;}

  .confetti-piece{position:fixed; top:-20px; width:9px; height:14px; z-index:50; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:0.9;}}

  @media(max-width:760px){
    .scene-inner{flex-direction:column; align-items:center; padding:76px 16px 20px; gap:8px;}
    .mascot{width:88px;}
    .panel{max-width:440px; padding:22px 18px; max-height:64vh;}
    .nav-arrow{width:38px; height:38px;}
    .home-btn{width:38px; height:38px;}
  }
</style>
</head>
<body>

<div id="gameRoot">

  <button class="home-btn" id="homeBtn" title="Başa dön">
    <svg viewBox="0 0 24 24" fill="none" stroke="#171050" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/><path d="M10 19v-6h4v6"/></svg>
  </button>
  <button class="nav-arrow left" id="navLeft" title="Geri">
    <svg viewBox="0 0 24 24" fill="none" stroke="#171050" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-arrow right" id="navRight" title="İleri">
    <svg viewBox="0 0 24 24" fill="none" stroke="#171050" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <!-- SCENE: grade picker -->
  <div class="scene scene-bg-welcome active" id="scene-grade">
    <div class="scene-deco" id="decoWelcome1"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot" id="mascotGrade"></div></div>
      <div class="panel">
        <span class="badge">Ücretsiz Matematik Macerası</span>
        <div class="bubble">Merhaba maceracı! Hangi sınıftasın? Sana uygun bulmacaları hazırlayayım. 🎒</div>
        <div class="kademe-group">
          <div class="kademe-title">Okul Öncesi</div>
          <div class="grade-grid"><button class="grade-btn" data-level="anaokulu">Anaokulu (4–6 yaş)</button></div>
        </div>
        <div class="kademe-group">
          <div class="kademe-title">İlkokul</div>
          <div class="grade-grid">
            <button class="grade-btn" data-level="ilkokul1">1. Sınıf</button>
            <button class="grade-btn" data-level="ilkokul2">2. Sınıf</button>
            <button class="grade-btn" data-level="ilkokul3">3. Sınıf</button>
            <button class="grade-btn" data-level="ilkokul4">4. Sınıf</button>
          </div>
        </div>
        <div class="kademe-group">
          <div class="kademe-title">Ortaokul</div>
          <div class="grade-grid">
            <button class="grade-btn" data-level="ortaokul5">5. Sınıf</button>
            <button class="grade-btn" data-level="ortaokul6">6. Sınıf</button>
            <button class="grade-btn" data-level="ortaokul7">7. Sınıf</button>
            <button class="grade-btn" data-level="ortaokul8">8. Sınıf (LGS)</button>
          </div>
        </div>
        <div class="kademe-group">
          <div class="kademe-title">Lise</div>
          <div class="grade-grid">
            <button class="grade-btn" data-level="lise9">9. Sınıf</button>
            <button class="grade-btn" data-level="lise10">10. Sınıf</button>
            <button class="grade-btn" data-level="lise11">11. Sınıf</button>
            <button class="grade-btn" data-level="lise12">12. Sınıf (YKS)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE: intro -->
  <div class="scene scene-bg-welcome" id="scene-intro">
    <div class="scene-deco" id="decoWelcome2"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot" id="mascotIntro"></div></div>
      <div class="panel" style="text-align:center;">
        <span class="level-pill" id="introLevelLabel"></span>
        <div class="bubble" id="introBubble" style="margin:10px auto 0; text-align:left;"></div>
        <button class="start-btn" id="startLevelBtn">Maceraya Başla →</button>
      </div>
    </div>
  </div>

  <!-- SCENE: hesapla -->
  <div class="scene scene-bg-library" id="scene-hesapla">
    <div class="scene-deco" id="decoLibrary"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot small" id="mascotHesapla"></div></div>
      <div class="panel" id="panelHesapla"></div>
    </div>
  </div>

  <!-- SCENE: kilit -->
  <div class="scene scene-bg-vault" id="scene-kilit">
    <div class="scene-deco" id="decoVault"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot small" id="mascotKilit"></div></div>
      <div class="panel" id="panelKilit"></div>
    </div>
  </div>

  <!-- SCENE: bulmaca -->
  <div class="scene scene-bg-plaza" id="scene-bulmaca">
    <div class="scene-deco" id="decoPlaza"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot small" id="mascotBulmaca"></div></div>
      <div class="panel" id="panelBulmaca"></div>
    </div>
  </div>

  <!-- SCENE: result -->
  <div class="scene scene-bg-result" id="scene-result">
    <div class="scene-deco" id="decoResult"></div>
    <div class="scene-inner">
      <div class="mascot-wrap"><div class="mascot" id="mascotResult"></div></div>
      <div class="panel" style="text-align:center;">
        <div class="bubble" id="resultBubble" style="margin:0 auto 14px;"></div>
        <div class="result-score">
          <div class="big" id="scoreBig"></div>
          <div class="label" id="scoreLabel"></div>
        </div>
        <div class="reveal-box"><span class="tag">Bonus — Vay Be Anı</span><p id="revealText"></p></div>
        <div class="parent-box"><span class="tag">Anthos Notu</span><p id="parentText"></p></div>
        <a class="cta-btn" href="deneme-formu.html">Ücretsiz Deneme Dersine Katıl</a>
        <span class="retry-link" id="retryBtn">Başka bir seviyeyi dene</span>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------- Mascot (full body) ---------- */
const MASCOT_SVG = `<svg viewBox="0 0 160 320" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="80" cy="308" rx="52" ry="10" fill="rgba(23,16,80,0.15)"/>
  <rect x="55" y="222" width="20" height="76" rx="8" fill="#D8C9A3"/>
  <rect x="85" y="222" width="20" height="76" rx="8" fill="#D8C9A3"/>
  <rect x="50" y="290" width="30" height="14" rx="7" fill="#5b4636"/>
  <rect x="80" y="290" width="30" height="14" rx="7" fill="#5b4636"/>
  <path d="M35 235 Q35 150 80 150 Q125 150 125 235 Z" fill="#E85C4A"/>
  <path d="M35 175 Q15 190 20 224" stroke="#E85C4A" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M125 175 Q145 190 140 224" stroke="#E85C4A" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="20" cy="227" r="10" fill="#F4B9AE"/>
  <circle cx="140" cy="227" r="10" fill="#F4B9AE"/>
  <circle cx="80" cy="108" r="48" fill="#F4B9AE"/>
  <path d="M30 98 Q38 53 80 56 Q122 53 130 98 Q130 63 80 61 Q34 63 30 98Z" fill="#171050"/>
  <circle cx="62" cy="110" r="6" fill="#1B1A2A"/>
  <circle cx="98" cy="110" r="6" fill="#1B1A2A"/>
  <circle cx="46" cy="120" r="7" fill="#F49E8C" opacity="0.6"/>
  <circle cx="114" cy="120" r="7" fill="#F49E8C" opacity="0.6"/>
  <path d="M62 130 Q80 143 98 130" stroke="#1B1A2A" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;
function mountMascots(){ document.querySelectorAll('.mascot').forEach(el => el.innerHTML = MASCOT_SVG); }

/* ---------- Lock SVGs ---------- */
const LOCK_CLOSED = `<svg viewBox="0 0 100 100"><rect x="24" y="46" width="52" height="42" rx="9" fill="#F3E3BE"/><path d="M34 46 V32 a16 16 0 0 1 32 0 V46" stroke="#F3E3BE" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="50" cy="63" r="6" fill="#171050"/><rect x="47" y="66" width="6" height="12" rx="3" fill="#171050"/></svg>`;
const LOCK_OPEN = `<svg viewBox="0 0 100 100"><rect x="24" y="46" width="52" height="42" rx="9" fill="#7C9D6F"/><path d="M34 46 V32 a16 16 0 0 1 32 0" stroke="#7C9D6F" stroke-width="8" fill="none" stroke-linecap="round" transform="rotate(-28 34 46)"/><path d="M42 66 l6 7 l12 -14" stroke="#F7F1E3" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- Confetti ---------- */
function burstConfetti(){
  const colors = ['#E85C4A','#241BC3','#7C9D6F','#C99A2E','#F4B9AE'];
  for(let i=0;i<28;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2 + Math.random()*1.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 3800);
  }
}

/* ---------- Scene decorations (pure CSS/SVG, no images) ---------- */
function buildDeco(){
  const w1 = document.getElementById('decoWelcome1');
  const w2 = document.getElementById('decoWelcome2');
  [w1,w2].forEach(w=>{
    if(!w) return;
    for(let i=0;i<4;i++){
      const c = document.createElement('div');
      c.className='deco-cloud';
      const size = 60+Math.random()*70;
      c.style.width=size+'px'; c.style.height=(size*0.5)+'px';

    const s = document.createElement('div');
    s.className='deco-shelf';
    s.style.top=(14+i*15)+'%';

  const vault = document.getElementById('decoVault');

    const st = document.createElement('div');
    st.className='deco-star';
    st.style.top=Math.random()*90+'%'; st.style.left=Math.random()*100+'%';
    st.style.opacity = 0.3+Math.random()*0.7;

  const plaza = document.getElementById('decoPlaza');
  const ground = document.createElement('div'); ground.className='deco-ground'; plaza.appendChild(ground);
  const goldBloom = ['#C99A2E','#E85C4A','#F3E3BE'];
  for(let i=0;i<14;i++){
    const d = document.createElement('div');
    d.className='deco-dot';
    d.style.background = goldBloom[i%3];
    d.style.top=(60+Math.random()*35)+'%'; d.style.left=(Math.random()*100)+'%';
    plaza.appendChild(d);
  }
  const res = document.getElementById('decoResult');
  const colors=['#C99A2E','#E85C4A','#7C9D6F','#241BC3'];
  for(let i=0;i<26;i++){
    const d = document.createElement('div');
    d.className='deco-dot';
    d.style.background = colors[i%4];
    d.style.top=(Math.random()*90)+'%'; d.style.left=(Math.random()*100)+'%';
    d.style.opacity=0.5+Math.random()*0.5;
    res.appendChild(d);
  }
}

/* ---------- State machine ---------- */
const SCENES = ['scene-grade','scene-intro','scene-hesapla','scene-kilit','scene-bulmaca','scene-result'];
let currentLevelKey=null, currentLevel=null, chIndex=0, stars=0, attempts=0, currentSceneId='scene-grade', solvedCurrent=false;

function goScene(id){
  SCENES.forEach(s=> document.getElementById(s).classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById(id).classList.add('pop-in');
  currentSceneId = id;
  updateNav();
}

function updateNav(){
  const left = document.getElementById('navLeft');
  const right = document.getElementById('navRight');
  left.disabled = (currentSceneId === 'scene-grade');
  if(currentSceneId === 'scene-grade'){ right.disabled = true; }
  else if(currentSceneId === 'scene-intro'){ right.disabled = false; }
  else if(['scene-hesapla','scene-kilit','scene-bulmaca'].includes(currentSceneId)){ right.disabled = !solvedCurrent; }
  else if(currentSceneId === 'scene-result'){ right.disabled = true; }
}

document.getElementById('homeBtn').addEventListener('click', ()=> goScene('scene-grade'));

document.getElementById('navRight').addEventListener('click', ()=>{
  if(currentSceneId === 'scene-intro'){ beginLevel(); }
  else if(['scene-hesapla','scene-kilit','scene-bulmaca'].includes(currentSceneId) && solvedCurrent){ advanceChallenge(); }
});
document.getElementById('navLeft').addEventListener('click', ()=>{
  if(currentSceneId === 'scene-intro'){ goScene('scene-grade'); }
  else if(['scene-hesapla','scene-kilit','scene-bulmaca'].includes(currentSceneId)){
    if(chIndex === 0){ goScene('scene-intro'); }
    else { chIndex--; renderChallenge(); }
  } else if(currentSceneId === 'scene-result'){ goScene('scene-grade'); }
});

document.querySelectorAll('.grade-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentLevelKey = btn.dataset.level;
    currentLevel = LEVELS[currentLevelKey];
    document.getElementById('introLevelLabel').textContent = currentLevel.label;
    document.getElementById('introBubble').innerHTML = currentLevel.intro;
    goScene('scene-intro');
  });
});
document.getElementById('startLevelBtn').addEventListener('click', beginLevel);

function beginLevel(){
  chIndex = 0; stars = 0;
  renderChallenge();
}

function sceneForType(type){
  return {hesapla:'scene-hesapla', kilit:'scene-kilit', bulmaca:'scene-bulmaca'}[type];
}

function renderStars(container){
  container.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('span');
    s.className = 'star' + (i < stars ? ' filled' : '');
    s.innerHTML = `<svg viewBox="0 0 24 24" fill="${i<stars?'#C99A2E':'#171050'}"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-4-6.3 4 1.7-7L1.9 9.5l7.1-.6z"/></svg>`;
    container.appendChild(s);
  }
}

function renderChallenge(){
  attempts = 0; solvedCurrent = false;
  const ch = currentLevel.challenges[chIndex];
  const sceneId = sceneForType(ch.type);
  const panel = document.getElementById(
    ch.type==='hesapla' ? 'panelHesapla' : ch.type==='kilit' ? 'panelKilit' : 'panelBulmaca'
  );

  let starsHtml = `<div class="stars-row" id="starsRow_${ch.type}"></div>`;
  let tagHtml, bodyHtml;

  if(ch.type === 'hesapla'){
    tagHtml = '🧮 Hesaplayalım!';
    const title = ch.display || ch.expr.join(' ') + ' = ?';
    let boxes = '';
    for(let i=0;i<ch.answer.length;i++) boxes += `<input class="digit-box" maxlength="1" inputmode="numeric" data-i="${i}">`;
    bodyHtml = `<div class="challenge-title">${title}</div><div class="digit-boxes" id="digitBoxes">${boxes}</div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="check-btn" id="checkBtn">Kontrol Edelim</button>
      <button class="next-btn hidden-btn" id="nextBtn">Devam Et →</button>`;
  }
  if(ch.type === 'kilit'){
    tagHtml = '🔒 Kilidi Aç!';
    bodyHtml = `<div class="challenge-title">İki adımı çöz, şifreyi bul ve kilidi aç!</div>
      <div class="lock-scene">
        <div class="lock-steps">
          <div><span class="lock-step">1. Basamak</span><br><span class="lock-expr">${ch.l1} = ?</span></div>
          <div><span class="lock-step">2. Basamak</span><br><span class="lock-expr">${ch.l2} = ?</span></div>
        </div>
        <div class="lock-visual" id="lockVisual">${LOCK_CLOSED}</div>
      </div>
      <div class="lock-inputs"><input class="lock-input" id="lockIn1" inputmode="numeric"><input class="lock-input" id="lockIn2" inputmode="numeric"></div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="check-btn" id="checkBtn">Aç</button>
      <button class="next-btn hidden-btn" id="nextBtn">Devam Et →</button>`;
  }
  if(ch.type === 'bulmaca'){
    tagHtml = '🧩 Bulmaca!';
    let opts = '';
    ch.options.forEach((o,i)=> opts += `<button class="opt-pill" data-i="${i}">${o}</button>`);
    bodyHtml = `<div class="challenge-title">${ch.q}</div><div class="bulmaca-options">${opts}</div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="next-btn hidden-btn" id="nextBtn">Devam Et →</button>`;
  }

  panel.innerHTML = `<span class="challenge-tag">${tagHtml}</span>` + starsHtml + bodyHtml;
  renderStars(panel.querySelector(`#starsRow_${ch.type}`));
  goScene(sceneId);
  wireChallenge(ch, panel);
}

function wireChallenge(ch, panel){
  if(ch.type === 'hesapla'){
    const inputs = panel.querySelectorAll('.digit-box');
    inputs.forEach((inp, idx)=>{
      inp.addEventListener('input', ()=>{
        inp.value = inp.value.replace(/[^0-9]/g,'');
        if(inp.value && idx < inputs.length-1) inputs[idx+1].focus();
      });
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Backspace' && !inp.value && idx>0) inputs[idx-1].focus(); });
    });
    setTimeout(()=> inputs[0] && inputs[0].focus(), 150);
    panel.querySelector('#checkBtn').onclick = ()=>{
      const val = Array.from(inputs).map(i=>i.value||'').join('');
      checkAnswer(panel, val === ch.answer, inputs, ch.answer);
    };
  }
  if(ch.type === 'kilit'){
    panel.querySelector('#checkBtn').onclick = ()=>{
      const in1 = panel.querySelector('#lockIn1'), in2 = panel.querySelector('#lockIn2');
      const ok = (in1.value.trim()===ch.a1) && (in2.value.trim()===ch.a2);
      checkAnswer(panel, ok, [in1,in2], ch.a1+' / '+ch.a2, ()=>{ panel.querySelector('#lockVisual').innerHTML = LOCK_OPEN; });
    };
  }
  if(ch.type === 'bulmaca'){
    panel.querySelectorAll('.opt-pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        panel.querySelectorAll('.opt-pill').forEach(b=>b.disabled=true);
        const i = parseInt(btn.dataset.i);
        const ok = i === ch.correct;
        if(ok) btn.classList.add('correct');
        else { btn.classList.add('wrong'); panel.querySelectorAll('.opt-pill')[ch.correct].classList.add('correct'); }
        finishChallenge(panel, ok);
      });
    });
  }
}

function checkAnswer(panel, ok, els, correctAnswer, onOk){
  const feedback = panel.querySelector('#feedbackMsg');
  if(ok){
    els.forEach(e=> e.classList.add('correct'));
    if(onOk) onOk();
    feedback.textContent = 'Harika, doğru! 🎉'; feedback.className = 'feedback-msg ok';
    finishChallenge(panel, true);
  } else {
    attempts++;
    els.forEach(e=>{ e.classList.add('wrong'); setTimeout(()=>e.classList.remove('wrong'),400); });
    if(attempts >= 2){
      feedback.textContent = 'Doğru cevap: ' + correctAnswer; feedback.className = 'feedback-msg no';
      els.forEach(e=> e.classList.add('correct'));
      if(onOk) onOk();
      finishChallenge(panel, false);
    } else {
      feedback.textContent = 'Tekrar dene, çok yaklaştın!'; feedback.className = 'feedback-msg hint';
    }
  }
}

function finishChallenge(panel, gotStar){
  if(gotStar){ stars++; renderStars(panel.querySelector('[id^="starsRow_"]')); burstConfetti(); }
  const checkBtn = panel.querySelector('#checkBtn');
  if(checkBtn) checkBtn.classList.add('hidden-btn');
  const nextBtn = panel.querySelector('#nextBtn');
  if(nextBtn) nextBtn.classList.remove('hidden-btn');
  solvedCurrent = true;
  updateNav();
  if(nextBtn) nextBtn.onclick = advanceChallenge;
}

function advanceChallenge(){
  chIndex++;
  if(chIndex < currentLevel.challenges.length){ renderChallenge(); }
  else { showResult(); }
}

function showResult(){
  document.getElementById('scoreBig').textContent = stars + ' / 3 ⭐';
  document.getElementById('scoreLabel').textContent = currentLevel.label + ' Tamamlandı';
  document.getElementById('revealText').textContent = currentLevel.reveal;
  document.getElementById('parentText').textContent = currentLevel.parent;
  const msgs = ['Harika iş çıkardın, tebrikler! 🎉','Süpersin, bütün bulmacaları çözdün! 🌟','Aferin sana, gerçek bir matematik kaşifisin! 🚀'];
  document.getElementById('resultBubble').innerHTML = msgs[Math.min(stars,2)];
  goScene('scene-result');
  burstConfetti();
}

document.getElementById('retryBtn').addEventListener('click', ()=> goScene('scene-grade'));

mountMascots();
buildDeco();
updateNav();
