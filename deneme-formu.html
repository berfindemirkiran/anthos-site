<!DOCTYPE html>
<html lang="tr">
<head>

<meta name="twitter:image" content="https://anthosacademy.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F7F1E3;
    --cream-2: #F0E8D4;
    --ink: #241BC3;
    --ink-deep: #171050;
    --charcoal: #1B1A2A;
    --bloom: #E85C4A;
    --bloom-soft: #F4B9AE;
    --sage: #7C9D6F;
    --gold: #C99A2E;
    --line: rgba(23,16,80,0.12);
    --radius: 22px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  h1,h2,h3{font-family:'Fraunces', serif; color:var(--ink-deep); font-weight:600; letter-spacing:-0.01em;}

  .top{
    width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center;
    text-align:center; margin-bottom:22px;
  }
  .brand-logo-img{height:56px; width:auto; margin-bottom:18px;}
  .top h1{font-size:clamp(24px,4vw,32px); margin-bottom:8px;}
  .top p{font-size:15.5px; color:var(--charcoal); opacity:0.78; max-width:480px;}

  .cta-band{
    width:100%; max-width:720px;
    background:linear-gradient(160deg, var(--bloom), #d1503f);
    border-radius:32px; padding:8px;
    box-shadow:0 30px 60px -20px rgba(232,92,74,0.45);
  }
  .trial-form{
    background:#fff; border-radius:24px; padding:34px 30px;
    box-shadow:0 20px 46px rgba(23,16,80,0.18);
    overflow-x:hidden;
  }
  .form-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px 18px;}
  .form-field{display:flex; flex-direction:column; gap:6px;}
  .form-field.full{grid-column:1 / -1;}
  .form-field label{
    font-size:12.5px; font-weight:600; color:var(--ink-deep);
    text-transform:uppercase; letter-spacing:0.04em; font-family:'JetBrains Mono', monospace;
  }
  .req{color:var(--bloom); margin-left:2px;}
  .form-field input[type="text"],
  .form-field input[type="email"],
  .form-field input[type="tel"],
  .form-field input[type="number"],
  .form-field input[type="date"],
  .form-field input[type="time"],
  .form-field select{
    border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:15px; color:var(--charcoal);
    background:var(--cream); width:100%; min-width:0;
  }
  .form-field input:focus,
  .form-field select:focus{outline:none; border-color:var(--ink);}

  .choice-row{display:flex; flex-wrap:wrap; gap:8px;}
  .choice-pill input{position:absolute; opacity:0; width:0; height:0;}
  .choice-pill label{
    display:inline-block; padding:10px 16px; border-radius:100px; border:1.5px solid var(--line);
    background:var(--cream); font-size:13.5px; font-weight:600; color:var(--ink-deep);
    cursor:pointer; transition:all 0.15s ease; user-select:none;
  }
  .choice-pill input:checked + label{
    background:var(--ink); border-color:var(--ink); color:#fff;
  }

  .datetime-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;}
  .datetime-row input{min-width:0; width:100%;}
  @media(max-width:420px){ .datetime-row{grid-template-columns:minmax(0,1fr);} }

  .form-hint{font-size:12px; color:var(--charcoal); opacity:0.6;}

  .form-submit{
    width:100%; margin-top:24px; padding:16px 20px; border:none; border-radius:100px;
    background:var(--bloom); color:#fff; font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 10px 24px rgba(232,92,74,0.35);
    transition:transform 0.15s ease;
  }
  .form-submit:hover{transform:translateY(-1px);}
  .form-submit:disabled{opacity:0.6; cursor:not-allowed; transform:none;}

  .form-status{margin-top:16px; font-size:13.5px; text-align:center; font-weight:600; display:none;}
  .form-status.ok{display:block; color:var(--sage);}
  .form-status.err{display:block; color:var(--bloom);}

  .back-link{
    margin-top:28px; font-size:13px; color:var(--ink-deep); opacity:0.7;
    text-decoration:none; font-family:'JetBrains Mono', monospace;
  }
  .back-link:hover{opacity:1; text-decoration:underline;}

  @media(max-width:600px){
    .cta-band{border-radius:24px;}
    .trial-form{padding:24px 16px;}
    .form-field input[type="text"],
    .form-field input[type="email"],
    .form-field input[type="tel"],
    .form-field input[type="number"],
    .form-field input[type="date"],
    .form-field input[type="time"],
    .form-field select{padding:12px 12px; font-size:16px;}
    .choice-row{gap:8px;}
    .choice-pill label{padding:9px 13px; font-size:13px;}
  }
  @media(max-width:380px){
    .trial-form{padding:20px 12px;}
  }
</style>
</head>
<body>

  <div class="top">
    <img class="brand-logo-img" src="logo.png" alt="Anthos">
    <h1>İlk dersi birlikte deneyelim.</h1>
    <p>Ücretsiz deneme dersi için formu doldurmanız yeterli — size 24 saat içinde dönüş yapıyoruz.</p>
  </div>

  <div class="cta-band">
    <form class="trial-form" id="trialForm" novalidate>
      <div class="form-grid">
        <div class="form-field">
          <label for="velinIsim">Velinin Adı ve Soyadı<span class="req">*</span></label>
          <input type="text" id="velinIsim" name="veli_ad_soyad" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="velinMail">Mail Adresi<span class="req">*</span></label>
          <input type="email" id="velinMail" name="veli_email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="velinTel">Telefon Numarası<span class="req">*</span></label>
          <input type="tel" id="velinTel" name="veli_telefon" required autocomplete="tel" placeholder="05xx xxx xx xx">
        </div>
        <div class="form-field">
          <label for="cocukAd">Çocuğun Adı<span class="req">*</span></label>
          <input type="text" id="cocukAd" name="cocuk_ad" required>
        </div>
        <div class="form-field">
          <label for="cocukYas">Yaşı<span class="req">*</span></label>
          <input type="number" id="cocukYas" name="cocuk_yas" min="3" max="18" required>
        </div>
        <div class="form-field">
          <label>Cinsiyeti<span class="req">*</span></label>
          <div class="choice-row">
            <span class="choice-pill">
              <input type="radio" id="cinsKiz" name="cocuk_cinsiyet" value="Kız" required>
              <label for="cinsKiz">Kız</label>
            </span>
            <span class="choice-pill">
              <input type="radio" id="cinsErkek" name="cocuk_cinsiyet" value="Erkek">
              <label for="cinsErkek">Erkek</label>
            </span>
          </div>
        </div>

        <div class="form-field full">
          <label for="sevilenDers">Çocuğunuzun en sevdiği ders hangisidir?<span class="req">*</span></label>
          <select id="sevilenDers" name="sevilen_ders" required>
            <option value="" disabled selected>Seçiniz</option>
            <option value="Fen Bilimleri">Fen Bilimleri</option>
            <option value="Matematik">Matematik</option>
            <option value="Bilgisayar Bilimleri">Bilgisayar Bilimleri</option>
            <option value="Tarih">Tarih</option>
            <option value="Edebiyat">Edebiyat</option>
            <option value="Diğer">Diğer</option>
          </select>
        </div>

        <div class="form-field full">
          <label>Öğrencinin derslerde kullanabileceği bir bilgisayarı var mı?<span class="req">*</span></label>
          <div class="choice-row">
            <span class="choice-pill">
              <input type="radio" id="bilgisayarEvet" name="bilgisayar_var_mi" value="Evet" required>
              <label for="bilgisayarEvet">Evet</label>
            </span>
            <span class="choice-pill">
              <input type="radio" id="bilgisayarHayir" name="bilgisayar_var_mi" value="Hayır">
              <label for="bilgisayarHayir">Hayır</label>
            </span>
          </div>
        </div>

        <div class="form-field full">
          <label>Daha önce bir kodlama eğitimi aldı mı?<span class="req">*</span></label>
          <div class="choice-row">
            <span class="choice-pill">
              <input type="checkbox" id="egitimArduino" name="onceki_egitim" value="Arduino">
              <label for="egitimArduino">Arduino</label>
            </span>
            <span class="choice-pill">
              <input type="checkbox" id="egitimScratch" name="onceki_egitim" value="Scratch">
              <label for="egitimScratch">Scratch</label>
            </span>
            <span class="choice-pill">
              <input type="checkbox" id="egitimRobotik" name="onceki_egitim" value="Robotik Kodlama">
              <label for="egitimRobotik">Robotik Kodlama</label>
            </span>
            <span class="choice-pill">
              <input type="checkbox" id="egitimPython" name="onceki_egitim" value="Python">
              <label for="egitimPython">Python</label>
            </span>
            <span class="choice-pill">
              <input type="checkbox" id="egitimYok" name="onceki_egitim" value="Hiç almadı">
              <label for="egitimYok">Hiç almadı</label>
            </span>
          </div>
        </div>

        <div class="form-field full">
          <label>Rezervasyon için uygun gün ve saat<span class="req">*</span></label>
          <div class="datetime-row">
            <input type="date" id="rezervTarih" name="rezervasyon_tarih" required aria-label="Tarih">
            <input type="time" id="rezervSaat" name="rezervasyon_saat" required aria-label="Saat">
          </div>
          <span class="form-hint">Belirttiğiniz tarih/saat kesin değildir, size en yakın uygun zamanı planlamak için kullanılır.</span>
        </div>
      </div>

      <button type="submit" class="btn form-submit">Deneme dersi başvurumu gönder</button>
      <p class="form-status" id="formStatus"></p>
    </form>
  </div>

  <a class="back-link" href="https://anthosacademy.com">← anthosacademy.com'a dön</a>

<script>
  const FORM_ENDPOINT = "https://formspree.io/f/mojogqjb";

  const trialForm = document.getElementById('trialForm');
  const formStatus = document.getElementById('formStatus');

  if(trialForm){
    const ANTHOS_SB_URL = 'https://pqxobhknksylbpesymrg.supabase.co';
const ANTHOS_SB_ANON_KEY = 'sb_publishable_-AKzWhUgk-wGSjworDMeaw_ZkX8YrXE';
async function submitTrialRequestToPanel(formData){
  try{
    const sb = window.supabase.createClient(ANTHOS_SB_URL, ANTHOS_SB_ANON_KEY);
    const cinsiyet = formData.getAll('cocuk_cinsiyet').filter(Boolean)[0] || '';
    const bilgisayar = formData.getAll('bilgisayar_var_mi').filter(Boolean)[0] || '';
    const oncekiEgitim = formData.getAll('onceki_egitim').filter(Boolean)[0] || '';
    return sb.from('trial_requests').insert({
      veli_ad_soyad: formData.get('veli_ad_soyad') || '',
      veli_email: formData.get('veli_email') || '',
      veli_telefon: formData.get('veli_telefon') || '',
      cocuk_ad: formData.get('cocuk_ad') || '',
      cocuk_yas: formData.get('cocuk_yas') || '',
      cocuk_cinsiyet: cinsiyet,
      sevilen_ders: formData.get('sevilen_ders') || '',
      bilgisayar_var_mi: bilgisayar,
      onceki_egitim: oncekiEgitim,
      rezervasyon_tarih: formData.get('rezervasyon_tarih') || '',
      rezervasyon_saat: formData.get('rezervasyon_saat') || '',
      kvkk_onay: formData.get('kvkk_onay') ? 'evet' : 'hayir'
    });
  }catch(err){ return Promise.resolve(); }
}
trialForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      submitTrialRequestToPanel(new FormData(trialForm)).catch(()=>{});
      formStatus.className = 'form-status';
      formStatus.textContent = '';

      const submitBtn = trialForm.querySelector('.form-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Gönderiliyor...';

      const formData = new FormData(trialForm);

      try{
        const response = await fetch(FORM_ENDPOINT, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if(response.ok){
          formStatus.textContent = 'Teşekkürler! Başvurunuzu aldık, 24 saat içinde size dönüş yapacağız.';
          formStatus.className = 'form-status ok';
          trialForm.reset();
          submitBtn.textContent = 'Deneme dersi başvurumu gönder';
          submitBtn.disabled = false;
        } else {
          throw new Error('Form gönderilemedi');
        }
      } catch(err){
        const veliAdi = formData.get('veli_ad_soyad') || '';
        const veliMail = formData.get('veli_email') || '';
        const veliTel = formData.get('veli_telefon') || '';
        const mailtoLink = 'mailto:merhaba@anthosacademy.com?subject=Deneme Dersi Basvurusu&body=' +
          encodeURIComponent('Veli: ' + veliAdi + '\nMail: ' + veliMail + '\nTelefon: ' + veliTel);
        formStatus.innerHTML = 'Form şu an otomatik gönderime bağlı değil. <a href="' + mailtoLink + '" style="color:var(--bloom); text-decoration:underline;">Buraya tıklayarak</a> bilgilerinizi mail ile gönderebilirsiniz.';
        formStatus.className = 'form-status err';
        submitBtn.textContent = 'Deneme dersi başvurumu gönder';
        submitBtn.disabled = false;
      }
    });
  }
</script>

</body>
</html>
