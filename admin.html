<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli | Anthos</title>
<style>
  :root{
    --cream: #F7F1E3;
    --cream-2: #F0E8D4;
    --ink: #241BC3;
    --ink-deep: #171050;
    --charcoal: #1B1A2A;
    --bloom: #E85C4A;
    --sage: #7C9D6F;
    --sage-soft: #DCE6D3;
    --gold: #C99A2E;
    --gold-soft: #F3E3BE;
    --line: rgba(23,16,80,0.12);
    --radius: 22px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream); color:var(--charcoal);
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif; line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .card{
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius);
    padding:40px; max-width:440px; width:100%; box-shadow:0 24px 60px rgba(23,16,80,0.08);
  }
  h1{font-size:22px; color:var(--ink-deep); margin-bottom:6px;}
  p.lead{font-size:13.5px; opacity:0.65; margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-deep); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14px; background:var(--cream);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--ink); background:#fff;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-weight:600; font-size:14.5px; padding:13px 24px; border-radius:100px; cursor:pointer; border:none;
    background:var(--bloom); color:#fff; transition:transform 0.18s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
  .msg{border-radius:12px; padding:12px 16px; font-size:13.5px; margin-bottom:16px; display:none;}
  .msg.error{background:rgba(232,92,74,0.1); color:var(--bloom); border:1px solid rgba(232,92,74,0.3);}
  .msg.success{background:rgba(124,157,111,0.14); color:var(--sage); border:1px solid rgba(124,157,111,0.35);}
  #gate{}
  #panel{display:none;}
  #result{display:none; margin-top:20px; background:var(--cream-2); border-radius:14px; padding:18px;}
  #result p{font-size:13.5px; margin-bottom:6px;}
  #result strong{color:var(--ink-deep);}
  .copy-btn{
    margin-top:10px; background:var(--ink-deep); color:#fff; border:none; border-radius:100px;
    padding:9px 16px; font-size:13px; cursor:pointer; font-weight:600;
  }
</style>
</head>
<body>

<div class="card" id="gate">
  <h1>Yönetim Girişi</h1>
  <p class="lead">Devam etmek için yönetim şifresini gir.</p>
  <div class="msg error" id="gateError"></div>
  <div class="field">
    <label for="gatePw">Yönetim Şifresi</label>
    <input type="password" id="gatePw">
  </div>
  <button class="btn" id="gateBtn">Devam Et</button>
</div>

<div class="card" id="panel">
  <h1>Yeni Öğrenci Hesabı</h1>
  <p class="lead">Bilgileri gir, hesap ve giriş şifresi otomatik oluşturulsun.</p>
  <div class="msg error" id="formError"></div>
  <form id="studentForm">
    <div class="field">
      <label for="fullName">Öğrenci Adı Soyadı</label>
      <input type="text" id="fullName" required>
    </div>
    <div class="field">
      <label for="email">E-posta</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="ageGroup">Yaş Grubu</label>
      <select id="ageGroup">
        <option value="">Seçiniz</option>
        <option value="Tohum">Tohum (5-7 yaş)</option>
        <option value="Filiz">Filiz (8-12 yaş)</option>
        <option value="Çiçek">Çiçek (13-18 yaş)</option>
      </select>
    </div>
    <div class="field">
      <label for="program">Program</label>
      <select id="program">
        <option value="">Seçiniz</option>
        <option value="Scratch">Scratch</option>
        <option value="Python">Python</option>
        <option value="Web Geliştirme">Web Geliştirme</option>
      </select>
    </div>
    <button type="submit" class="btn" id="submitBtn">Hesap Oluştur</button>
  </form>

  <div id="result">
    <p><strong>E-posta:</strong> <span id="resEmail"></span></p>
    <p><strong>Şifre:</strong> <span id="resPassword"></span></p>
    <button class="copy-btn" id="copyBtn">WhatsApp için kopyala</button>
  </div>
</div>

<script>
  const FUNCTION_URL = 'https://pqxobhknksylbpesymrg.supabase.co/functions/v1/create-student';
  let adminSecret = '';

  const gate = document.getElementById('gate');
  const panel = document.getElementById('panel');
  const gateError = document.getElementById('gateError');
  const gateBtn = document.getElementById('gateBtn');
  const formError = document.getElementById('formError');
  const studentForm = document.getElementById('studentForm');
  const submitBtn = document.getElementById('submitBtn');
  const resultBox = document.getElementById('result');

  gateBtn.addEventListener('click', () => {
    const pw = document.getElementById('gatePw').value.trim();
    if(!pw){
      gateError.textContent = 'Şifre gerekli.';
      gateError.style.display = 'block';
      return;
    }
    adminSecret = pw;
    gate.style.display = 'none';
    panel.style.display = 'block';
  });

  studentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.style.display = 'none';
    resultBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Oluşturuluyor…';

    const full_name = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const age_group = document.getElementById('ageGroup').value;
    const program = document.getElementById('program').value;

    try {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_secret: adminSecret, email, full_name, age_group, program })
      });
      const data = await res.json();

      if(!res.ok){
        formError.textContent = 'Hata: ' + (data.error || 'Bilinmeyen hata');
        formError.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Hesap Oluştur';
        return;
      }

      document.getElementById('resEmail').textContent = data.email;
      document.getElementById('resPassword').textContent = data.password;
      resultBox.style.display = 'block';
      studentForm.reset();
    } catch(err){
      formError.textContent = 'Bağlantı hatası: ' + err.message;
      formError.style.display = 'block';
    }

    submitBtn.disabled = false;
    submitBtn.textContent = 'Hesap Oluştur';
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const email = document.getElementById('resEmail').textContent;
    const password = document.getElementById('resPassword').textContent;
    const text = `Anthos Öğrenci Platformu giriş bilgileriniz:\nSite: anthosacademy.com/platform.html\nE-posta: ${email}\nŞifre: ${password}`;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Kopyalandı ✓';
      setTimeout(() => { btn.textContent = original; }, 1800);
    });
  });
</script>
</body>
</html>
